<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai.interviewer — Start Dialog</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header>
    <h1>Start Dialog <span class="badge" id="state" data-state="IDLE">IDLE</span></h1>
    <p id="health" class="muted">Memeriksa ASR…</p>
  </header>

  <section class="controls">
    <button id="btnStart">Start Dialog</button>
    <button id="btnStop" disabled>Stop</button>
    <button id="btnClear" class="ghost">Bersihkan</button>
    <label class="lang-hint">
      Bahasa:
      <select id="langHint">
        <option value="auto">Auto</option>
        <option value="id">Indonesia</option>
        <option value="en">English</option>
      </select>
    </label>
  </section>

  <p id="echoWarn" class="warn" hidden></p>
  <p id="bufferWarn" class="warn" hidden></p>

  <section class="channels">
    <div class="channel channel--candidate">
      <div class="channel__head">
        <strong>Kandidat (mic)</strong>
        <span id="statusCandidate" class="chan-status bad">DEAD</span>
      </div>
      <div class="vu"><div id="vuCandidate" class="vu__bar"></div></div>
    </div>
    <div class="channel channel--interviewer">
      <div class="channel__head">
        <strong>Interviewer (tab audio)</strong>
        <span id="statusInterviewer" class="chan-status bad">DEAD</span>
      </div>
      <div class="vu"><div id="vuInterviewer" class="vu__bar"></div></div>
    </div>
  </section>

  <main>
    <section class="pane">
      <h2>Timeline</h2>
      <div id="timeline" class="timeline"></div>
    </section>

    <aside class="pane">
      <h2>Saran (Claude)</h2>
      <div id="suggestion" class="muted">Belum ada pertanyaan.</div>

      <h2>Portfolio kandidat</h2>

      <div class="portfolio-picker">
        <select id="portfolioPicker">
          <option value="">— pilih dari riwayat —</option>
        </select>
        <button id="btnDeletePortfolio" class="ghost" disabled>Hapus</button>
      </div>

      <input type="file" id="portfolioFile" accept="application/pdf" />
      <p id="portfolioStatus" class="muted"></p>
      <textarea id="portfolio" rows="6" placeholder="Ringkasan pengalaman, stack, proyek… (atau upload PDF CV di atas)"></textarea>

      <div class="portfolio-save">
        <input type="text" id="portfolioName" placeholder="Nama CV (mis. CV-2026-BackendEngineer)" maxlength="100" />
        <button id="btnSavePortfolio">Simpan ke riwayat</button>
      </div>
    </aside>
  </main>

  <footer class="metrics">
    <span>asr_latency_ms: <b id="mAsr">–</b></span>
    <span>claude_ms: <b id="mClaude">–</b></span>
    <span>frames_dropped: <b id="mDropped">0</b></span>
    <span>ws_reconnects: <b id="mReconnects">0</b></span>
    <span>audio_dropped_sec: <b id="mBufferDropped">0</b></span>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
